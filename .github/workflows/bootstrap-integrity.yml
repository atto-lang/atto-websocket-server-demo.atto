name: Bootstrap demo integrity
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-integrity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Keep the bootstrap status fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Status: empty-demo bootstrap.**' README.md
          grep -Fxq 'schema=1' demo-status.txt
          grep -Fxq 'status=bootstrap-only' demo-status.txt
          grep -Fxq 'execution=disabled' demo-status.txt
          grep -Fxq 'network=disabled' demo-status.txt
          grep -Fxq 'compiler-evidence=none' demo-status.txt
          grep -Fxq 'production-claim=false' demo-status.txt
          test -s DEMO_CONTRACT.md
          grep -Fq 'exact-head' DEMO_CONTRACT.md

          executable="$(find . -path './.git' -prune -o -type f \( -name '*.ores' -o -name 'pom.xml' -o -name 'Cargo.toml' -o -name 'package.json' \) -print -quit)"
          if [[ -n "$executable" ]]; then
            echo "Executable/demo source exists while README still declares an empty bootstrap: $executable" >&2
            echo "Replace this bootstrap gate with compiler/runtime tests in the same change that makes the demo executable." >&2
            exit 1
          fi

          forbidden='pull_request_''target|workflow_''run|repository_''dispatch'
          if grep -R -n -E "$forbidden" .github/workflows --include='*.yml' --include='*.yaml'; then
            echo "Privileged/indirect workflow triggers are not allowed in an empty demo bootstrap." >&2
            exit 1
          fi
