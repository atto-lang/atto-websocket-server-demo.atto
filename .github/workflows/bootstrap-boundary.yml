name: Canonical AttoLang source boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject stale bootstrap, legacy guest and symlinks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Status: source-authored' README.md
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"
          test -z "$(git ls-files -- '*.ores')"
          test "$(git ls-files -- '*.atto' | wc -l | tr -d ' ')" -eq 3
          echo 'ATTO_SOURCE_BOUNDARY_PASS; no compiler or WebSocket guest executed'
      - name: Run source-free carrier preflight negative tests (audit only)
        shell: bash
        run: bash ci/test-carrier-source-preflight.sh
