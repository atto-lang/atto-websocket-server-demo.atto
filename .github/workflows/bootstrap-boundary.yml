name: WebSocket bootstrap boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require Oreslang source with strict NOT_EXECUTED provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Status: source-authored, NOT_EXECUTED.**' README.md
          grep -Fq 'No actual WebSocket listener has been executed' README.md
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"
          test -f src/echo_contract.ores
          test -f src/echo_actor.ores
          test -f tests/echo_contract_test.ores
          grep -Fq 'define actor EchoActor as' src/echo_actor.ores
          grep -Fq 'pub fnc main(): int' tests/echo_contract_test.ores
          if grep -Eq '^[[:space:]]*(pub[[:space:]]+)?(fnc|routine)[[:space:]]+main[[:space:]]*\\(' src/echo_contract.ores src/echo_actor.ores; then
            echo 'POLICY_FAILURE: library or actor defines a competing main()' >&2
            exit 1
          fi
          count="$(git ls-files -- '*.ores' | wc -l | tr -d ' ')"
          test "$count" = 3
          test -z "$(git ls-files -- '*.java' '*.class')"
          echo 'SOURCE_AUTHORED_BOUNDARY_PASS; .ores source exists, compiler and wire execution remain NOT_EXECUTED.'
