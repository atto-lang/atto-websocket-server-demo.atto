name: AttoLang source maturity gate (structural)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and test Rust claim checker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          rustc --edition=2021 --test ci/verify-maturity.rs -o target/maturity-tests
          target/maturity-tests
          rustc --edition=2021 ci/verify-maturity.rs -o target/maturity-check
          target/maturity-check
