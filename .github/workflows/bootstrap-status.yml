# Structural-only maturity gate. Neither this workflow nor its Rust tests execute an Oreslang guest.
name: Bootstrap demo status gate (structural only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile dependency-free Rust structural validator
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -D warnings ci/bootstrap_guard.rs -o "$RUNNER_TEMP/bootstrap-guard"
          rustc --edition=2021 -D warnings --test ci/bootstrap_guard.rs -o "$RUNNER_TEMP/bootstrap-guard-tests"
      - name: Test adversarial bootstrap policy cases (host only)
        shell: bash
        run: "$RUNNER_TEMP/bootstrap-guard-tests"
      - name: Enforce exact-head bootstrap status and repository inventory
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: "$RUNNER_TEMP/bootstrap-guard"
