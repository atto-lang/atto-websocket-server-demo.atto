name: Bootstrap demo status gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and run dependency-free Rust status checker regressions
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test ci/bootstrap-status.rs -o "$RUNNER_TEMP/ws-status-tests"
          "$RUNNER_TEMP/ws-status-tests"
      - name: Validate maturity claims against Git-indexed source
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings ci/bootstrap-status.rs -o "$RUNNER_TEMP/ws-bootstrap-status"
          "$RUNNER_TEMP/ws-bootstrap-status"
